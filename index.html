<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Simply Estetica & Benessere</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(
          135deg,
          #f7f3e9 0%,
          #f7f3e9 35%,
          #f5e7e2 35%,
          #f5e7e2 70%,
          #eef0e5 70%
        );
      color: #333;
      min-height: 100vh;
      padding: 10px 14px;
    }

    .pagina {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: #ded5c8;
      border-radius: 190px 190px 0 0;
      padding: 45px 22px 18px;
      min-height: calc(100vh - 20px);
    }

    .logo {
      text-align: center;
      margin-bottom: 6px;
    }

    .logo-img {
      display: block;
      width: 100%;
      max-width: 330px;
      height: auto;
      margin: 0 auto;
    }

    .frase {
      text-align: center;
      font-size: 14px;
      margin: 10px 0 12px;
      color: #333;
    }

    .link,
    .link-disattivo {
      width: 100%;
      height: 59px;
      margin-bottom: 12px;
      background: #eee8db;
      border: 1px solid #aaa98e;
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #333;
      position: relative;
      font-size: 16px;
      transition: 0.15s ease;
    }

    .link:active {
      transform: scale(0.98);
      background: #e7e0d2;
    }

    .icona {
      width: 54px;
      min-width: 54px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #879475;
    }

    .icona svg {
      width: 29px;
      height: 29px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .testo {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
    }

    .link-disattivo {
      cursor: default;
    }

    .facebook svg {
      fill: #879475;
      stroke: none;
    }

    .pagina > :last-child {
      margin-bottom: 0;
    }

    @media (max-width: 380px) {
      .pagina {
        padding-left: 18px;
        padding-right: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="pagina">

    <header class="logo">
      <img
        src="logo-simply.png"
        alt="Simply Estetica & Benessere di Sara La Scalea"
        class="logo-img"
      >
    </header>

    <div class="frase">
      Il vostro benessere, semplicemente.
    </div>


    <!-- WHATSAPP -->
    <div class="link-disattivo">

      <div class="icona">
        <svg viewBox="0 0 24 24">
          <path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5z"/>
          <path d="M8.5 8.5c.4 3 2 4.5 5 5.5"/>
        </svg>
      </div>

      <div class="testo">
        WhatsApp
      </div>

    </div>


    <!-- FACEBOOK -->
    <a
      class="link"
      href="https://facebook.com/simplyestetica"
      target="_blank"
      rel="noopener"
    >

      <div class="icona facebook">
        <svg viewBox="0 0 24 24">
          <path d="M14 8h3V4h-3c-3 0-5 2-5 5v3H6v4h3v8h4v-8h3l1-4h-4V9c0-.7.3-1 1-1z"/>
        </svg>
      </div>

      <div class="testo">
        Facebook
      </div>

    </a>


    <!-- INSTAGRAM -->
    <div class="link-disattivo">

      <div class="icona">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/>
        </svg>
      </div>

      <div class="testo">
        Instagram
      </div>

    </div>


    <!-- LISTINO PREZZI -->
    <div class="link-disattivo">

      <div class="icona">
        <svg viewBox="0 0 24 24">
          <path d="M3 13l10-10h7v7L10 20z"/>
          <circle cx="17" cy="7" r="1"/>
        </svg>
      </div>

      <div class="testo">
        Listino Prezzi
      </div>

    </div>


    <!-- BUONO REGALO -->
    <div class="link-disattivo">

      <div class="icona">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="9" width="18" height="12"/>
          <path d="M12 9v12"/>
          <path d="M2 5h20v4H2z"/>
          <path d="M12 5c-1-4-6-4-6-1 0 2 3 2 6 1z"/>
          <path d="M12 5c1-4 6-4 6-1 0 2-3 2-6 1z"/>
        </svg>
      </div>

      <div class="testo">
        Buono regalo
      </div>

    </div>


    <!-- DOVE SIAMO -->
    <div class="link-disattivo">

      <div class="icona">
        <svg viewBox="0 0 24 24">
          <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/>
          <circle cx="12" cy="10" r="2.5"/>
        </svg>
      </div>

      <div class="testo">
        Dove siamo
      </div>

    </div>

  </main>

</body>
</html>
